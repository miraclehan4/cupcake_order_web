name: Streamlit Keep Alive

on:
  schedule:
    # 改为每隔 2 小时在整点运行一次
    - cron: '0 */1 * * *'
  workflow_dispatch: # 允许手动运行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit app
        run: |
          curl -I https://cozycrumbcakeorder.streamlit.app/
