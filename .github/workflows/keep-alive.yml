name: Keep Streamlit App Alive

on:
  schedule:
    # Every 6 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          curl -I --max-time 60 --retry 3 --retry-delay 5 \
            -o /dev/null -s -w "%{http_code}\n" \
            https://cozycrumbcakeorder.streamlit.app/
